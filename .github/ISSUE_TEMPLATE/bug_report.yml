name: 🐛 Bug report
description: The scanner, the sync workflow or the skill instructions did something wrong.
title: "[Bug] <short summary>"
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - preflight_scan.py (false positive)
        - preflight_scan.py (false negative)
        - preflight_scan.py (crash)
        - SKILL.md instructions
        - Policy sync workflow
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Command, relevant manifest/plist/gradle snippet, and scanner output.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, macOS 26, Flutter 3.x"
